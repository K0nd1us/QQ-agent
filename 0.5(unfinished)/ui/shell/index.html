<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#191a19">
  <title>QQ Agent / 控制台</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/token-management.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="QQ Agent 导航">
      <div class="brand">
        <button id="brand-emblem" class="brand-emblem" type="button" aria-controls="nav" aria-expanded="true" aria-label="收起侧栏" title="收起侧栏"></button>
        <span class="brand-copy"><strong>QQ AGENT</strong><small>LOCAL CONTROL SYSTEM</small></span>
      </div>
      <button id="navigation-dismiss" class="navigation-dismiss" type="button" aria-label="收起导航" title="收起导航；按 Esc 返回工作区"></button>
      <nav id="nav" aria-label="控制台面板"></nav>
      <footer class="rail-footer">
        <section id="runtime-readiness" class="runtime-readiness" aria-label="运行就绪状态">
          <button class="readiness-item" id="ready-onebot" type="button" data-readiness="onebot" data-state="unknown" data-icon-active="true" aria-label="OneBot：检查中" aria-describedby="ready-onebot-detail"><span class="readiness-icon" aria-hidden="true"></span><span class="readiness-copy"><span class="readiness-name">OneBot</span><small>检查中</small></span></button>
          <button class="readiness-item" id="ready-model" type="button" data-readiness="model" data-state="unknown" data-icon-active="true" aria-label="模型配置：检查中" aria-describedby="ready-model-detail"><span class="readiness-icon" aria-hidden="true"></span><span class="readiness-copy"><span class="readiness-name">模型配置</span><small>检查中</small></span></button>
        </section>
        <div class="top-status"><span id="status-dot" aria-hidden="true"></span><span id="sse" role="status">SSE 连接中</span></div>
        <div class="rail-signature"><span>本地控制台</span><span>V / 0.5</span></div>
      </footer>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="workspace-context visually-hidden">
          <span id="workspace-index" class="workspace-index" aria-hidden="true">00</span>
          <div><h1 id="workspace-title">控制台</h1><p id="workspace-description" class="visually-hidden">准备工作面板</p></div>
        </div>
        <div class="runtime-controls">
          <button id="navigation-toggle" type="button" aria-controls="nav" aria-expanded="false" title="临时显示导航；按 Esc 收起">显示导航</button>
          <span id="runtime-state" role="status">读取运行状态…</span>
          <span id="cache-hit-rate" role="status" title="等待今日用量统计">今日缓存命中 —</span>
          <button id="pause-btn" type="button" aria-pressed="false" disabled>全局暂停</button>
        </div>
      </header>
      <main id="panel-host" aria-live="polite"></main>
    </section>
  </div>
  <dl class="readiness-details" hidden>
    <div><dt>OneBot</dt><dd id="ready-onebot-detail">正在读取状态。</dd></div>
    <div><dt>模型配置</dt><dd id="ready-model-detail">正在读取配置。</dd></div>
  </dl>
  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text"><form method="dialog"><div class="dialog-kicker">操作确认 / CONFIRM</div><h2 id="confirm-title">请确认操作</h2><p id="confirm-text"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-accept" class="danger" value="accept">确认</button></div></form></dialog>
  <section id="permission-asks" aria-live="polite" aria-label="待处理权限请求"></section>
  <script type="module" src="/account-center.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
