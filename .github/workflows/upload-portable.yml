name: Upload QQ Portable to Release

on:
  workflow_dispatch:
    inputs:
      src_url:
        description: 'Signed source URL (short-lived)'
        required: true
      asset_name:
        description: 'Asset filename'
        required: false
        default: 'QQ_portable.zip'
      tag:
        description: 'Release tag'
        required: false
        default: 'qq-portable-2026-09'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download from origin
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 5 --retry-all-errors \
               --speed-time 60 --speed-limit 10240 \
               -o "${{ inputs.asset_name }}" "${{ inputs.src_url }}"
          ls -l "${{ inputs.asset_name }}"
          sha256sum "${{ inputs.asset_name }}"

      - name: Verify integrity
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "${{ inputs.asset_name }}")
          H=$(sha256sum "${{ inputs.asset_name }}" | cut -d' ' -f1)
          echo "size=$SIZE sha256=$H"
          [ "$SIZE" = "711181265" ] || { echo "::error::size mismatch: $SIZE"; exit 1; }
          [ "$H" = "2b669aae5237b2ce23fb092e4d8a226c3ccd50e87bf917d767c53226f33e8005" ] || { echo "::error::sha256 mismatch: $H"; exit 1; }
          echo "integrity OK"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" "${{ inputs.asset_name }}" --clobber --repo "${{ github.repository }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" --draft=false --repo "${{ github.repository }}"
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json url,assets
