<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>人设广场 · QQ Agent</title>
<!-- Kondius 统一主题包：流动背景 / 极光 / 粒子连线 / 鼠标拖尾 / 波浪点击 / 滚动入场 / 备案页脚。
     站点环境下由 /assets/ 提供；本地直开文件时缺失，走下面 .no-theme 兜底背景。 -->
<link rel="stylesheet" href="/assets/theme.css" />
<script src="/assets/theme.js" defer></script>
<style>
:root{--ink:#34271f;--muted:#7f7167;--bg:#f6f0e8;--paper:#fffaf2;--line:#e6d8c8;--accent:#bd633f;--accent2:#8c3e2b;--shadow:0 18px 55px rgba(92,55,30,.13)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:transparent;line-height:1.65}
/* 主题包缺席（本地预览）时的兜底背景，站点环境下自动失效 */
html.no-theme body{background:radial-gradient(800px 450px at 8% -10%,#ffe5cf,transparent 66%),radial-gradient(850px 480px at 94% 0,#eadff8,transparent 65%),var(--bg)}.wrap{max-width:1160px;margin:auto;padding:0 24px}.nav{position:sticky;top:0;z-index:5;background:rgba(255,250,242,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.navin{height:66px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800}.brand b{color:var(--accent)}.links{display:flex;gap:8px}.pill{padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;background:rgba(255,255,255,.5)}.pill:hover,.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}.hero{padding:72px 0 45px;text-align:center}.eyebrow{display:inline-block;color:var(--accent2);background:#f8ddce;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(40px,6vw,74px);line-height:1.04;letter-spacing:-.05em;margin:17px 0}.hero p{max-width:650px;margin:auto;color:var(--muted);font-size:17px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:5px 0 25px}.search{min-width:250px;flex:1;border:1px solid var(--line);background:rgba(255,255,255,.65);border-radius:10px;padding:11px 14px;color:var(--ink);font:inherit}.select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 13px;color:var(--ink);font:inherit}.upload{position:relative;overflow:hidden;background:var(--accent);color:#fff;border-radius:10px;padding:10px 15px;font-size:13px;cursor:pointer}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;padding-bottom:75px}.card{background:rgba(255,250,242,.83);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(92,55,30,.06);display:flex;flex-direction:column;min-height:260px}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);transition:.2s}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#f1c4b0;color:var(--accent2);font-family:Georgia,serif;font-size:25px}.cardhead{display:flex;gap:13px;align-items:center}.card h2{font-family:Georgia,"Songti SC",serif;font-size:22px;margin:0 0 3px}.category{font-size:12px;color:var(--accent)}.card p{color:var(--muted);font-size:14px;margin:18px 0}.prompt-preview{background:#f8eee4;border:1px solid #efdfcf;border-radius:11px;padding:12px;color:#65574e;font-size:12px;white-space:pre-wrap;max-height:86px;overflow:hidden}.meta{display:flex;gap:12px;color:var(--muted);font-size:12px;margin-top:auto;padding-top:16px}.actions{display:flex;gap:8px;margin-top:14px}.btn{border:0;border-radius:9px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer;background:var(--accent);color:#fff}.btn.ghost{background:#f2e4d7;color:var(--accent2)}.empty{text-align:center;color:var(--muted);padding:70px;grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(55,38,27,.38);display:grid;place-items:center;padding:18px;z-index:20}.modalbox{background:var(--paper);border:1px solid var(--line);border-radius:18px;width:min(680px,100%);padding:23px;box-shadow:var(--shadow)}.modal h2{font-family:Georgia,serif;margin:0 0 16px}.modal label{display:block;font-size:13px;margin:10px 0 5px}.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fffdf9;color:var(--ink);font:inherit}.modal textarea{min-height:190px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.notice{color:var(--muted);font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:13px;padding:13px 15px;margin-bottom:18px}@media(max-width:640px){.wrap{padding:0 16px}.links .pill:nth-child(2){display:none}.hero{padding-top:45px}.grid{grid-template-columns:1fr}}
</style></head>
<body><nav class="nav"><div class="wrap navin"><div class="brand">QQ <b>Agent</b> / 人设广场</div><div class="links"><a class="pill" href="/qq-agent/skill-market/">Skill 市场</a><a class="pill active" href="/qq-agent/persona-plaza/">人设广场</a><a class="pill" href="/qq-agent/">返回官网</a></div></div></nav>
<main class="wrap"><section class="hero"><span class="eyebrow">人格 · 语气 · 世界观</span><h1>让你的 Agent<br><span style="color:var(--accent)">先成为“谁”。</span></h1><p>浏览社区分享的人设和系统提示词，一键复制到 QQ Agent 使用。也可以在这里发布自己的角色卡，让每个机器人都拥有不同的说话方式。</p></section><div class="notice">提示词会影响机器人表达方式，但不会覆盖宿主的安全规则和工具协议。不要在公开人设中写入 API Key、Cookie、个人隐私或越权指令。</div><section class="toolbar"><input class="search" id="search" placeholder="搜索人设名称、描述或提示词…" /><select class="select" id="category"><option value="all">全部类型</option><option value="companion">陪伴型</option><option value="roleplay">角色扮演</option><option value="utility">实用助手</option><option value="custom">自定义</option></select><button class="btn" id="new">新建人设</button></section><section class="grid" id="grid"><div class="empty">正在加载人设…</div></section></main>
<div id="modal" hidden></div><script>
const API='/api/community';let items=[];const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function toast(t){alert(t)}
function render(){const q=$('#search').value.trim().toLowerCase(),c=$('#category').value;const list=items.filter(x=>(c==='all'||x.category===c)&&(!q||`${x.title} ${x.description} ${x.id}`.toLowerCase().includes(q)));$('#grid').innerHTML=list.length?list.map(x=>`<article class="card"><div class="cardhead"><div class="avatar">${esc((x.title||'?').slice(0,1))}</div><div><h2>${esc(x.title||'未命名人设')}</h2><span class="category">${esc(x.category||'custom')} · ${esc(x.author||'社区用户')}</span></div></div><p>${esc(x.description||'一张来自社区的人设卡。')}</p><div class="prompt-preview">点击“复制提示词”后读取完整内容</div><div class="meta"><span>${x.hasPrompt?'含提示词':'无提示词'}</span><span>${esc(x.updatedAt||'')}</span></div><div class="actions"><button class="btn" data-copy="${esc(x.id)}">复制提示词</button></div></article>`).join(''):'<div class="empty">没有匹配的人设</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const x=items.find(i=>i.id===b.dataset.copy);if(!x)return;try{const d=await fetch(API+'/personas/'+encodeURIComponent(x.id)+'/prompt').then(r=>r.json());if(!d.ok)throw Error(d.error||'读取失败');await navigator.clipboard?.writeText(d.prompt||'');toast('提示词已复制，可以粘贴到 QQ Agent 的“系统提示词覆盖”或“人设”字段。')}catch(e){toast(e.message)}})}
function open(){const m=$('#modal');m.hidden=false;m.innerHTML=`<div class="modal"><form class="modalbox" id="form"><h2>分享一张人设卡</h2><label>名称</label><input name="title" required maxlength="120" placeholder="例如：嘴硬但心软的夜班群友"/><label>类型</label><select class="select" name="category"><option value="custom">自定义</option><option value="companion">陪伴型</option><option value="roleplay">角色扮演</option><option value="utility">实用助手</option></select><label>一句话介绍</label><input name="description" maxlength="500" placeholder="这张人设适合什么场景？"/><label>系统提示词 / 人设提示词</label><textarea name="prompt" required maxlength="120000" placeholder="写下角色身份、语气、边界与示例……"></textarea><div class="modalfoot"><button type="button" class="btn ghost" id="cancel">取消</button><button class="btn">发布到广场</button></div></form></div>`;$('#cancel').onclick=()=>m.hidden=true;$('#form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch(API+'/personas',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}).then(x=>x.json());if(!r.ok)throw Error(r.error||'发布失败');m.hidden=true;await load();toast('人设已发布')}catch(err){toast(err.message)}}}
async function load(){try{const d=await fetch(API+'/personas').then(r=>r.json());items=d.items||[];render()}catch(e){$('#grid').innerHTML='<div class="empty">广场暂时无法连接，请稍后重试。</div>'}}$('#search').oninput=render;$('#category').onchange=render;$('#new').onclick=open;load();
// 主题包未加载（本地预览）时启用兜底背景
addEventListener('load',()=>{if(!document.getElementById('th-flow-bg')&&!document.getElementById('th-canvas'))document.documentElement.classList.add('no-theme')});
</script></body></html>
